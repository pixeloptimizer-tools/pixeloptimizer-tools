<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixelOptimizer — 3D Intro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b1b2b;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    color: #fff;
  }
  canvas { display: block; }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #overlay.visible { opacity: 1; }
  #overlay h1 {
    font-size: 4rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 0%, #93c5fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
    text-shadow: 0 0 60px rgba(37, 99, 235, 0.5);
  }
  #overlay p {
    font-size: 1.25rem;
    color: #93c5fd;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  #replay {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(37, 99, 235, 0.9);
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 40px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #replay.visible { opacity: 1; }
  #replay:hover { background: #1d4ed8; }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #93c5fd;
    font-size: 1rem;
    z-index: 50;
    background: #0b1b2b;
  }
</style>
</head>
<body>
<div id="loading">Loading 3D intro...</div>

<div id="overlay">
  <h1>PixelOptimizer</h1>
  <p>Compress · Resize · Convert · Crop</p>
</div>

<button id="replay">↻ Replay Intro</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ---------- SETUP ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1b2b);
scene.fog = new THREE.Fog(0x0b1b2b, 15, 45);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

// ---------- LIGHTS ----------
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

const point1 = new THREE.PointLight(0x2563eb, 120, 60);
point1.position.set(10, 10, 10);
scene.add(point1);

const point2 = new THREE.PointLight(0x60a5fa, 80, 60);
point2.position.set(-10, -5, 8);
scene.add(point2);

const point3 = new THREE.PointLight(0x1d4ed8, 100, 60);
point3.position.set(0, -12, -10);
scene.add(point3);

// ---------- FLOATING IMAGE FRAMES ----------
// Create "image frames" as glowing rectangles floating in space
const frameGroup = new THREE.Group();
scene.add(frameGroup);

const frameColors = [0x2563eb, 0x3b82f6, 0x60a5fa, 0x93c5fd, 0x1d4ed8];
const frames = [];

for (let i = 0; i < 30; i++) {
  const w = 1.2 + Math.random() * 1.6;
  const h = 0.8 + Math.random() * 1.0;
  const geo = new THREE.PlaneGeometry(w, h);
  
  const mat = new THREE.MeshStandardMaterial({
    color: frameColors[i % frameColors.length],
    emissive: frameColors[i % frameColors.length],
    emissiveIntensity: 0.6,
    transparent: true,
    opacity: 0.85,
    side: THREE.DoubleSide,
    metalness: 0.3,
    roughness: 0.4
  });
  
  const mesh = new THREE.Mesh(geo, mat);
  
  // Random position in a sphere-ish volume
  const radius = 6 + Math.random() * 12;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  
  mesh.position.x = radius * Math.sin(phi) * Math.cos(theta);
  mesh.position.y = radius * Math.sin(phi) * Math.sin(theta);
  mesh.position.z = radius * Math.cos(phi) - 5;
  
  mesh.rotation.x = Math.random() * Math.PI;
  mesh.rotation.y = Math.random() * Math.PI;
  mesh.rotation.z = Math.random() * Math.PI;
  
  // Store original position for animation
  mesh.userData = {
    basePos: mesh.position.clone(),
    baseRot: { x: mesh.rotation.x, y: mesh.rotation.y, z: mesh.rotation.z },
    speed: 0.3 + Math.random() * 0.7,
    phase: Math.random() * Math.PI * 2
  };
  
  frames.push(mesh);
  frameGroup.add(mesh);
}

// ---------- PIXEL PARTICLES ----------
// Create small cube pixels floating around
const particleGroup = new THREE.Group();
scene.add(particleGroup);

const pixelColors = [0x2563eb, 0x60a5fa, 0x93c5fd, 0xbfdbfe];
const pixelGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
const particles = [];

for (let i = 0; i < 400; i++) {
  const mat = new THREE.MeshStandardMaterial({
    color: pixelColors[i % pixelColors.length],
    emissive: pixelColors[i % pixelColors.length],
    emissiveIntensity: 1.2,
    transparent: true,
    opacity: 0.9
  });
  
  const pixel = new THREE.Mesh(pixelGeo, mat);
  
  const r = 4 + Math.random() * 20;
  const t = Math.random() * Math.PI * 2;
  const p = Math.acos(2 * Math.random() - 1);
  
  pixel.position.x = r * Math.sin(p) * Math.cos(t);
  pixel.position.y = r * Math.sin(p) * Math.sin(t);
  pixel.position.z = r * Math.cos(p) - 8;
  
  pixel.userData = {
    basePos: pixel.position.clone(),
    speed: 0.5 + Math.random() * 1.5,
    phase: Math.random() * Math.PI * 2,
    scaleBase: 0.5 + Math.random() * 1.5
  };
  
  particles.push(pixel);
  particleGroup.add(pixel);
}

// ---------- CENTRAL "PIXEL" ICON ----------
// Create a central floating cube that represents the logo
const logoGroup = new THREE.Group();
scene.add(logoGroup);

const logoBoxGeo = new THREE.BoxGeometry(2, 2, 2);
const logoBoxMat = new THREE.MeshStandardMaterial({
  color: 0x2563eb,
  emissive: 0x2563eb,
  emissiveIntensity: 1.5,
  metalness: 0.8,
  roughness: 0.2
});
const logoBox = new THREE.Mesh(logoBoxGeo, logoBoxMat);
logoGroup.add(logoBox);

// Wireframe overlay
const wireframeMat = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  wireframe: true,
  transparent: true,
  opacity: 0.15
});
const logoWireframe = new THREE.Mesh(logoBoxGeo, wireframeMat);
logoGroup.add(logoWireframe);

// Start logo small and rotated
logoGroup.scale.set(0.01, 0.01, 0.01);
logoGroup.rotation.x = Math.PI * 2;
logoGroup.rotation.y = Math.PI * 2;

// ---------- ANIMATION TIMELINE ----------
const CLOCK = new THREE.Clock();
let elapsed = 0;
let phase = 'intro'; // intro → zoom → logo → end
const DURATION = 8; // seconds total

// Camera keyframes
// 0s: far back, frames visible
// 3s: flying through frames
// 5s: approaching center
// 7s: logo fills screen
// 8s: fade out, show overlay

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function animate() {
  requestAnimationFrame(animate);
  
  const dt = CLOCK.getDelta();
  elapsed += dt;
  
  const t = Math.min(elapsed / DURATION, 1);
  
  // --- Camera animation ---
  if (t < 0.35) {
    // Phase 1: drift back, reveal frames
    const p = t / 0.35;
    camera.position.z = 18 + p * 4;
    camera.position.x = Math.sin(p * Math.PI * 2) * 2;
    camera.position.y = Math.cos(p * Math.PI * 2) * 1.5;
    camera.lookAt(0, 0, 0);
  } else if (t < 0.7) {
    // Phase 2: fly through frames toward center
    const p = (t - 0.35) / 0.35;
    const eased = easeInOutCubic(p);
    camera.position.z = 22 - eased * 18;
    camera.position.x = Math.sin(p * Math.PI) * 1.5;
    camera.position.y = Math.cos(p * Math.PI) * 1.0;
    camera.lookAt(0, 0, 0);
  } else if (t < 0.9) {
    // Phase 3: approach the logo
    const p = (t - 0.7) / 0.2;
    const eased = easeInOutCubic(p);
    camera.position.z = 4 - eased * 2.5;
    camera.position.x = 0;
    camera.position.y = 0;
    camera.lookAt(0, 0, 0);
  } else {
    // Phase 4: logo fills screen
    const p = (t - 0.9) / 0.1;
    camera.position.z = 1.5 - p * 0.2;
    camera.lookAt(0, 0, 0);
  }
  
  // --- Frames animation ---
  frames.forEach((frame, i) => {
    const time = elapsed * frame.userData.speed + frame.userData.phase;
    frame.position.x = frame.userData.basePos.x + Math.sin(time * 0.5) * 0.5;
    frame.position.y = frame.userData.basePos.y + Math.cos(time * 0.5) * 0.5;
    frame.rotation.x = frame.userData.baseRot.x + Math.sin(time * 0.3) * 0.3;
    frame.rotation.y = frame.userData.baseRot.y + Math.cos(time * 0.3) * 0.3;
    
    // Fade out frames near the end
    if (t > 0.75) {
      frame.material.opacity = Math.max(0, 0.85 - (t - 0.75) * 3.4);
    }
  });
  
  // --- Particles animation ---
  particles.forEach((p, i) => {
    const time = elapsed * p.userData.speed + p.userData.phase;
    p.position.x = p.userData.basePos.x + Math.sin(time * 0.4) * 0.8;
    p.position.y = p.userData.basePos.y + Math.cos(time * 0.4) * 0.8;
    p.rotation.x += dt * p.userData.speed;
    p.rotation.y += dt * p.userData.speed * 0.7;
    
    const scale = p.userData.scaleBase * (0.6 + Math.sin(time * 2) * 0.4);
    p.scale.setScalar(scale);
    
    if (t > 0.7) {
      p.material.opacity = Math.max(0, 0.9 - (t - 0.7) * 3);
    }
  });
  
  // --- Logo animation ---
  if (t < 0.7) {
    // Logo small, rotating
    logoGroup.scale.set(0.01, 0.01, 0.01);
    logoGroup.rotation.x += dt * 2;
    logoGroup.rotation.y += dt * 2.5;
  } else if (t < 0.9) {
    // Logo scales up
    const p = (t - 0.7) / 0.2;
    const s = easeInOutCubic(p) * 1;
    logoGroup.scale.set(s, s, s);
    logoGroup.rotation.x += dt * 1;
    logoGroup.rotation.y += dt * 1.5;
  } else {
    // Logo settles at final rotation
    logoGroup.scale.set(1, 1, 1);
    logoGroup.rotation.x += dt * 0.5;
    logoGroup.rotation.y += dt * 0.8;
  }
  
  // Light animation
  point1.position.x = Math.sin(elapsed * 0.5) * 12;
  point1.position.y = Math.cos(elapsed * 0.5) * 12;
  point2.position.x = Math.cos(elapsed * 0.6) * 10;
  point2.position.y = Math.sin(elapsed * 0.6) * 10;
  
  // Show overlay at the end
  if (t >= 0.95 && !document.getElementById('overlay').classList.contains('visible')) {
    document.getElementById('overlay').classList.add('visible');
    document.getElementById('replay').classList.add('visible');
  }
  
  renderer.render(scene, camera);
}

// ---------- HIDE LOADER ----------
setTimeout(() => {
  document.getElementById('loading').style.display = 'none';
  animate();
}, 300);

// ---------- REPLAY ----------
document.getElementById('replay').addEventListener('click', () => {
  elapsed = 0;
  camera.position.set(0, 0, 18);
  logoGroup.scale.set(0.01, 0.01, 0.01);
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('replay').classList.remove('visible');
  frames.forEach(f => { f.material.opacity = 0.85 });
  particles.forEach(p => { p.material.opacity = 0.9 });
});

// ---------- RESIZE ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
