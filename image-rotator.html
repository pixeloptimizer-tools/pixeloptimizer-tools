<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Rotator — PixelOptimizer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; color: #0b1b2b; line-height: 1.5; background: #fff; padding: 20px; font-size: 16px; }
.wrap { max-width: 900px; margin: 0 auto; }
h1 { font-size: 2rem; font-weight: 700; margin: 0 0 12px; }
.lead { font-size: 1.05rem; color: #475569; margin: 0 0 28px; }
.drop { background: #fff; border: 2px dashed #c7d6ec; border-radius: 20px; padding: 48px 24px; text-align: center; cursor: pointer; margin-bottom: 20px; transition: .2s; }
.drop:hover, .drop.over { border-color: #2563eb; background: #f8faff; }
.drop .ico { font-size: 3rem; margin-bottom: 16px; display: block; }
.drop h3 { font-size: 1.3rem; margin: 0 0 8px; font-weight: 700; }
.drop p { font-size: .95rem; color: #64748b; margin: 0; }
.pick { display: inline-block; margin-top: 18px; background: #2563eb; color: #fff; font-weight: 600; padding: 11px 26px; border-radius: 40px; font-size: .95rem; border: none; cursor: pointer; font-family: inherit; }
.editor { display: none; background: #fff; border-radius: 20px; border: 1px solid #eef2f6; padding: 24px; }
.editor.on { display: block; }
.head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid #eef2f6; }
.fname { font-weight: 600; font-size: .95rem; }
.preview { background: #0b1b2b; border-radius: 12px; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 220px; margin-bottom: 18px; overflow: hidden; }
.preview img { max-width: 100%; max-height: 400px; border-radius: 8px; transition: transform .3s ease; }
.preset-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.preset-btn { background: #f1f5f9; color: #334155; border: 2px solid transparent; padding: 10px 18px; border-radius: 40px; font-size: .9rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; }
.preset-btn:hover { background: #e2e8f0; }
.preset-btn.active { background: #2563eb; color: #fff; border-color: #1d4ed8; }
.custom-row { background: #eff6ff; border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; }
.custom-row label { display: flex; justify-content: space-between; font-weight: 600; font-size: .9rem; margin-bottom: 10px; }
.custom-row label span { color: #2563eb; }
.custom-row input[type=range] { width: 100%; -webkit-appearance: none; appearance: none; height: 6px; background: #e2e8f0; border-radius: 3px; outline: none; }
.custom-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: #2563eb; border-radius: 50%; cursor: pointer; }
.custom-row input[type=range]::-moz-range-thumb { width: 20px; height: 20px; background: #2563eb; border: none; border-radius: 50%; cursor: pointer; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: #2563eb; color: #fff; font-weight: 600; padding: 12px 26px; border-radius: 40px; font-size: .98rem; border: none; cursor: pointer; font-family: inherit; margin-right: 8px; margin-bottom: 8px; }
.btn:disabled { background: #cbd5e1; cursor: not-allowed; }
.ghost { background: transparent; color: #64748b; border: none; font-weight: 600; padding: 10px 16px; cursor: pointer; border-radius: 40px; font-size: .9rem; font-family: inherit; }
.result { display: none; margin-top: 24px; padding-top: 24px; border-top: 1px solid #eef2f6; }
.result.on { display: block; }
.result h3 { font-size: 1.15rem; color: #10b981; margin: 0 0 14px; font-weight: 700; }
.result img { max-width: 100%; max-height: 400px; border-radius: 12px; display: block; margin: 0 auto 14px; }
.meta { text-align: center; font-size: .9rem; color: #64748b; margin-bottom: 16px; }
.priv { margin-top: 28px; padding: 18px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 14px; font-size: .88rem; color: #166534; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Image Rotator</h1>
  <p class="lead">Rotate any image by 90° increments or any custom angle you choose.</p>

  <div class="drop" id="drop">
    <span class="ico">🔄</span>
    <h3>Drop image here</h3>
    <p>or click to browse — JPG, PNG, WebP</p>
    <button type="button" class="pick" onclick="document.getElementById('file').click()">Choose image</button>
    <input type="file" id="file" accept="image/*" style="display:none">
  </div>

  <div class="editor" id="editor">
    <div class="head">
      <div class="fname" id="fname">image.jpg</div>
      <div style="font-size:.82rem;color:#64748b">Original: <strong id="dim">—</strong></div>
    </div>
    <div class="preview"><img id="prev" alt="" style="display:none"></div>

    <div class="preset-row" id="presets">
      <button type="button" class="preset-btn" data-deg="90">90° ↻</button>
      <button type="button" class="preset-btn" data-deg="180">180°</button>
      <button type="button" class="preset-btn" data-deg="270">270° ↺</button>
      <button type="button" class="preset-btn" data-deg="-90">-90° ↺</button>
    </div>

    <div class="custom-row">
      <label>Custom angle <span id="angleVal">0°</span></label>
      <input type="range" id="angle" min="-180" max="180" value="0" step="1">
    </div>

    <button type="button" class="btn" id="go">Apply rotation</button>
    <button type="button" class="ghost" id="reset">Choose another</button>

    <div class="result" id="result">
      <h3>✓ Rotated successfully!</h3>
      <img id="resultImg" alt="">
      <div class="meta" id="meta"></div>
      <div style="text-align:center">
        <button type="button" class="btn" id="dl">Download rotated image</button>
      </div>
    </div>
  </div>

  <div class="priv"><strong>100% private.</strong> Everything runs in your browser.</div>
</div>

<script>
(function(){
  var s = { img: null, url: null, angle: 0 };
  var $ = function(id){ return document.getElementById(id) };
  var drop = $('drop'), fi = $('file'), ed = $('editor'), pv = $('prev'), fn = $('fname'), dm = $('dim'), presetsEl = $('presets'), angle = $('angle'), angleVal = $('angleVal'), go = $('go'), rst = $('reset'), res = $('result'), ri = $('resultImg'), rm = $('meta'), dl = $('dl');
  if(!drop) return;

  function load(f){
    if(!f || f.type.indexOf('image/')!==0) return alert('Please select an image.');
    var r = new FileReader();
    r.onload = function(e){
      var i = new Image();
      i.onload = function(){
        s.img = i;
        pv.src = e.target.result; pv.style.display = 'block';
        ed.classList.add('on'); res.classList.remove('on');
        fn.textContent = f.name;
        dm.textContent = i.naturalWidth + ' × ' + i.naturalHeight;
        s.angle = 0; angle.value = 0; angleVal.textContent = '0°';
        pv.style.transform = 'rotate(0deg)';
        presetsEl.querySelectorAll('.preset-btn').forEach(function(b){ b.classList.remove('active') });
      };
      i.src = e.target.result;
    };
    r.readAsDataURL(f);
  }

  function updatePreview(){
    pv.style.transform = 'rotate(' + s.angle + 'deg)';
    angleVal.textContent = s.angle + '°';
  }

  presetsEl.addEventListener('click', function(e){
    var btn = e.target.closest('.preset-btn');
    if(!btn) return;
    presetsEl.querySelectorAll('.preset-btn').forEach(function(b){ b.classList.toggle('active', b === btn) });
    s.angle = parseInt(btn.getAttribute('data-deg'), 10);
    angle.value = s.angle;
    updatePreview();
  });

  angle.addEventListener('input', function(){
    s.angle = parseInt(angle.value, 10);
    presetsEl.querySelectorAll('.preset-btn').forEach(function(b){ b.classList.remove('active') });
    updatePreview();
  });

  go.addEventListener('click', function(){
    if(!s.img) return;
    go.disabled = true; go.textContent = 'Rotating...';
    var w = s.img.naturalWidth, h = s.img.naturalHeight;
    var rad = s.angle * Math.PI / 180;
    var cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
    var newW = Math.round(w * cos + h * sin);
    var newH = Math.round(w * sin + h * cos);
    var c = document.createElement('canvas'); c.width = newW; c.height = newH;
    var x = c.getContext('2d');
    x.fillStyle = '#ffffff';
    x.fillRect(0, 0, newW, newH);
    x.translate(newW/2, newH/2);
    x.rotate(rad);
    x.imageSmoothingQuality = 'high';
    x.drawImage(s.img, -w/2, -h/2);
    c.toBlob(function(b){
      go.disabled = false; go.textContent = 'Apply rotation';
      if(!b) return alert('Rotation failed.');
      if(s.url) URL.revokeObjectURL(s.url);
      s.url = URL.createObjectURL(b);
      ri.src = s.url;
      rm.innerHTML = newW + ' × ' + newH + ' px • Rotated ' + s.angle + '° • <strong style="color:#10b981">' + (b.size/1024).toFixed(1) + ' KB</strong>';
      res.classList.add('on');
      res.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 'image/jpeg', 0.92);
  });

  dl.addEventListener('click', function(){
    if(!s.url) return;
    var a = document.createElement('a'); a.href = s.url; a.download = 'rotated.jpg';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });

  rst.addEventListener('click', function(){
    ed.classList.remove('on'); res.classList.remove('on');
    s.img = null; fi.value = '';
    drop.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  drop.addEventListener('click', function(e){ if(e.target.classList.contains('pick')) return; fi.click() });
  fi.addEventListener('change', function(e){ if(e.target.files[0]){ load(e.target.files[0]); fi.value = '' } });
  ['dragenter','dragover'].forEach(function(v){ drop.addEventListener(v, function(e){ e.preventDefault(); drop.classList.add('over') }) });
  ['dragleave','drop'].forEach(function(v){ drop.addEventListener(v, function(e){ e.preventDefault(); drop.classList.remove('over') }) });
  drop.addEventListener('drop', function(e){ if(e.dataTransfer.files[0]) load(e.dataTransfer.files[0]) });
})();
</script>
</body>
</html>
