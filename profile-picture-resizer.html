<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Picture Resizer — PixelOptimizer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; color: #0b1b2b; line-height: 1.5; background: #fff; padding: 20px; font-size: 16px; }
.wrap { max-width: 900px; margin: 0 auto; }
h1 { font-size: 2rem; font-weight: 700; margin: 0 0 12px; }
.lead { font-size: 1.05rem; color: #475569; margin: 0 0 28px; }
.drop { background: #fff; border: 2px dashed #c7d6ec; border-radius: 20px; padding: 48px 24px; text-align: center; cursor: pointer; margin-bottom: 20px; transition: .2s; }
.drop:hover, .drop.over { border-color: #2563eb; background: #f8faff; }
.drop .ico { font-size: 3rem; margin-bottom: 16px; display: block; }
.drop h3 { font-size: 1.3rem; margin: 0 0 8px; font-weight: 700; }
.drop p { font-size: .95rem; color: #64748b; margin: 0; }
.pick { display: inline-block; margin-top: 18px; background: #2563eb; color: #fff; font-weight: 600; padding: 11px 26px; border-radius: 40px; font-size: .95rem; border: none; cursor: pointer; font-family: inherit; }
.editor { display: none; background: #fff; border-radius: 20px; border: 1px solid #eef2f6; padding: 24px; }
.editor.on { display: block; }
.head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid #eef2f6; }
.fname { font-weight: 600; font-size: .95rem; }
.preview { background: #0b1b2b; border-radius: 12px; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 220px; margin-bottom: 18px; }
.preview img { max-width: 100%; max-height: 400px; border-radius: 8px; }
.presets-label { font-size: .9rem; font-weight: 700; color: #1e293b; margin: 0 0 12px; }
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
.preset-btn { background: #f1f5f9; color: #334155; border: 2px solid transparent; padding: 14px 12px; border-radius: 12px; font-size: .88rem; font-weight: 600; cursor: pointer; text-align: center; font-family: inherit; transition: all .15s; }
.preset-btn:hover { background: #e2e8f0; }
.preset-btn.active { background: #2563eb; color: #fff; border-color: #1d4ed8; }
.preset-btn .sub { display: block; font-size: .7rem; font-weight: 500; opacity: .85; margin-top: 3px; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: #2563eb; color: #fff; font-weight: 600; padding: 12px 26px; border-radius: 40px; font-size: .98rem; border: none; cursor: pointer; font-family: inherit; margin-right: 8px; margin-bottom: 8px; }
.btn:disabled { background: #cbd5e1; cursor: not-allowed; }
.ghost { background: transparent; color: #64748b; border: none; font-weight: 600; padding: 10px 16px; cursor: pointer; border-radius: 40px; font-size: .9rem; font-family: inherit; }
.result { display: none; margin-top: 24px; padding-top: 24px; border-top: 1px solid #eef2f6; }
.result.on { display: block; }
.result h3 { font-size: 1.15rem; color: #10b981; margin: 0 0 14px; font-weight: 700; }
.result-preview { background: linear-gradient(45deg, #e2e8f0 25%, transparent 25%, transparent 75%, #e2e8f0 75%, #e2e8f0), linear-gradient(45deg, #e2e8f0 25%, #fff 25%, #fff 75%, #e2e8f0 75%, #e2e8f0); background-size: 20px 20px; background-position: 0 0, 10px 10px; border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 14px; }
.result img { max-width: 240px; max-height: 240px; border-radius: 50%; box-shadow: 0 8px 20px -8px rgba(0,0,0,.15); }
.meta { text-align: center; font-size: .9rem; color: #64748b; margin-bottom: 16px; }
.priv { margin-top: 28px; padding: 18px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 14px; font-size: .88rem; color: #166534; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Profile Picture Resizer</h1>
  <p class="lead">Resize your image for any social media profile picture — perfectly cropped to a circle.</p>

  <div class="drop" id="drop">
    <span class="ico">👤</span>
    <h3>Drop photo here</h3>
    <p>or click to browse — JPG, PNG, WebP</p>
    <button type="button" class="pick" onclick="document.getElementById('file').click()">Choose photo</button>
    <input type="file" id="file" accept="image/*" style="display:none">
  </div>

  <div class="editor" id="editor">
    <div class="head">
      <div class="fname" id="fname">photo.jpg</div>
      <div style="font-size:.82rem;color:#64748b">Original: <strong id="dim">—</strong></div>
    </div>
    <div class="preview"><img id="prev" alt="" style="display:none"></div>

    <p class="presets-label">Choose platform:</p>
    <div class="presets" id="presets">
      <button type="button" class="preset-btn active" data-size="400" data-name="Instagram">Instagram<span class="sub">400×400</span></button>
      <button type="button" class="preset-btn" data-size="170" data-name="Facebook">Facebook<span class="sub">170×170</span></button>
      <button type="button" class="preset-btn" data-size="400" data-name="Twitter/X">Twitter / X<span class="sub">400×400</span></button>
      <button type="button" class="preset-btn" data-size="400" data-name="LinkedIn">LinkedIn<span class="sub">400×400</span></button>
      <button type="button" class="preset-btn" data-size="400" data-name="TikTok">TikTok<span class="sub">400×400</span></button>
      <button type="button" class="preset-btn" data-size="800" data-name="YouTube">YouTube<span class="sub">800×800</span></button>
      <button type="button" class="preset-btn" data-size="500" data-name="WhatsApp">WhatsApp<span class="sub">500×500</span></button>
      <button type="button" class="preset-btn" data-size="256" data-name="Discord">Discord<span class="sub">256×256</span></button>
    </div>

    <button type="button" class="btn" id="go">Resize profile picture</button>
    <button type="button" class="ghost" id="reset">Choose another</button>

    <div class="result" id="result">
      <h3>✓ Resized successfully!</h3>
      <div class="result-preview"><img id="resultImg" alt=""></div>
      <div class="meta" id="meta"></div>
      <div style="text-align:center">
        <button type="button" class="btn" id="dl">Download profile picture</button>
      </div>
    </div>
  </div>

  <div class="priv"><strong>100% private.</strong> Everything runs in your browser.</div>
</div>

<script>
(function(){
  var s = { img: null, url: null, size: 400, name: 'Instagram' };
  var $ = function(id){ return document.getElementById(id) };
  var drop = $('drop'), fi = $('file'), ed = $('editor'), pv = $('prev'), fn = $('fname'), dm = $('dim'), presetsEl = $('presets'), go = $('go'), rst = $('reset'), res = $('result'), ri = $('resultImg'), rm = $('meta'), dl = $('dl');
  if(!drop) return;

  function load(f){
    if(!f || f.type.indexOf('image/')!==0) return alert('Please select an image.');
    var r = new FileReader();
    r.onload = function(e){
      var i = new Image();
      i.onload = function(){
        s.img = i;
        pv.src = e.target.result; pv.style.display = 'block';
        ed.classList.add('on'); res.classList.remove('on');
        fn.textContent = f.name;
        dm.textContent = i.naturalWidth + ' × ' + i.naturalHeight;
      };
      i.src = e.target.result;
    };
    r.readAsDataURL(f);
  }

  presetsEl.addEventListener('click', function(e){
    var btn = e.target.closest('.preset-btn');
    if(!btn) return;
    presetsEl.querySelectorAll('.preset-btn').forEach(function(b){ b.classList.toggle('active', b === btn) });
    s.size = parseInt(btn.getAttribute('data-size'), 10);
    s.name = btn.getAttribute('data-name');
  });

  go.addEventListener('click', function(){
    if(!s.img) return;
    go.disabled = true; go.textContent = 'Resizing...';
    var size = s.size;
    var c = document.createElement('canvas'); c.width = size; c.height = size;
    var x = c.getContext('2d');
    x.imageSmoothingQuality = 'high';
    // Center-crop to square
    var srcSize = Math.min(s.img.naturalWidth, s.img.naturalHeight);
    var sx = (s.img.naturalWidth - srcSize) / 2;
    var sy = (s.img.naturalHeight - srcSize) / 2;
    x.drawImage(s.img, sx, sy, srcSize, srcSize, 0, 0, size, size);
    c.toBlob(function(b){
      go.disabled = false; go.textContent = 'Resize profile picture';
      if(!b) return alert('Resize failed.');
      if(s.url) URL.revokeObjectURL(s.url);
      s.url = URL.createObjectURL(b);
      ri.src = s.url;
      rm.innerHTML = size + ' × ' + size + ' px • ' + s.name + ' • <strong style="color:#10b981">' + (b.size/1024).toFixed(1) + ' KB</strong>';
      res.classList.add('on');
      res.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 'image/jpeg', 0.92);
  });

  dl.addEventListener('click', function(){
    if(!s.url) return;
    var a = document.createElement('a'); a.href = s.url; a.download = 'profile-' + s.name.toLowerCase().replace(/[^a-z]/g, '') + '.jpg';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  });

  rst.addEventListener('click', function(){
    ed.classList.remove('on'); res.classList.remove('on');
    s.img = null; fi.value = '';
    drop.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  drop.addEventListener('click', function(e){ if(e.target.classList.contains('pick')) return; fi.click() });
  fi.addEventListener('change', function(e){ if(e.target.files[0]){ load(e.target.files[0]); fi.value = '' } });
  ['dragenter','dragover'].forEach(function(v){ drop.addEventListener(v, function(e){ e.preventDefault(); drop.classList.add('over') }) });
  ['dragleave','drop'].forEach(function(v){ drop.addEventListener(v, function(e){ e.preventDefault(); drop.classList.remove('over') }) });
  drop.addEventListener('drop', function(e){ if(e.dataTransfer.files[0]) load(e.dataTransfer.files[0]) });
})();
</script>
</body>
</html>
